<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Where is it · 核心界面</title>
  <style>
    :root {
      --canvas: #fbfbfa;
      --surface: #ffffff;
      --text: #202123;
      --muted: #6f6f6b;
      --faint: #999994;
      --line: #e5e5e1;
      --line-strong: #d7d7d2;
      --ink: #242422;
      --ink-hover: #111110;
      --soft: #f3f3f0;
      --focus: #77776f;
      --radius: 12px;
      --ease: 180ms ease;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--canvas);
    }

    body {
      min-height: 100dvh;
      margin: 0;
      color: var(--text);
      background: var(--canvas);
      font-family: Geist, "SF Pro Display", "SF Pro Text", "Microsoft YaHei UI",
        "PingFang SC", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea { font: inherit; }
    button { touch-action: manipulation; }

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 1000;
      padding: 8px 12px;
      color: var(--surface);
      background: var(--ink);
      border-radius: 6px;
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .site-header {
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 28px;
    }

    .wordmark {
      color: var(--text);
      font-size: 14px;
      font-weight: 620;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .shell {
      width: min(100% - 40px, 720px);
      margin: clamp(72px, 13vh, 132px) auto 96px;
    }

    .search-section h1 {
      margin: 0 0 22px;
      font-size: clamp(26px, 3.5vw, 34px);
      font-weight: 580;
      line-height: 1.18;
      letter-spacing: -0.035em;
    }

    .composer {
      position: relative;
      padding: 16px 16px 12px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      transition: border-color var(--ease);
    }

    .composer:focus-within { border-color: #aaa9a3; }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 48px;
      max-height: 144px;
      padding: 0;
      resize: none;
      overflow-y: auto;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 16px;
      line-height: 1.55;
    }

    .composer textarea::placeholder { color: var(--faint); }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      margin-top: 4px;
    }

    .icon-button,
    .submit-button,
    .close-button {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      border-radius: 50%;
      transition: color var(--ease), background-color var(--ease), border-color var(--ease), opacity var(--ease);
    }

    .icon-button {
      color: var(--muted);
      background: transparent;
      border: 0;
    }

    .icon-button:hover {
      color: var(--text);
      background: var(--soft);
    }

    .submit-button {
      color: var(--surface);
      background: var(--ink);
      border: 1px solid var(--ink);
    }

    .submit-button:hover {
      background: var(--ink-hover);
      border-color: var(--ink-hover);
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.48;
    }

    .icon-button svg,
    .submit-button svg,
    .close-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .result {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
    }

    .result-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 520;
    }

    .result-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: var(--muted);
      border-radius: 50%;
    }

    .answer {
      max-width: 620px;
      margin: 0;
      font-size: clamp(27px, 4.2vw, 38px);
      font-weight: 560;
      line-height: 1.28;
      letter-spacing: -0.04em;
    }

    .answer-detail {
      max-width: 600px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .result-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 24px;
    }

    .text-button {
      min-height: 44px;
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      cursor: pointer;
      font-size: 14px;
      font-weight: 560;
      transition: border-color var(--ease);
    }

    .text-button:hover { border-color: var(--text); }

    .inference {
      color: var(--faint);
      font-size: 13px;
    }

    .inference strong {
      color: var(--muted);
      font-weight: 560;
    }

    .live-status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    dialog {
      width: min(92vw, 680px);
      padding: 0;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: none;
    }

    dialog::backdrop { background: rgb(25 25 23 / 48%); }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .close-button {
      color: var(--muted);
      background: transparent;
      border: 0;
    }

    .close-button:hover {
      color: var(--text);
      background: var(--soft);
    }

    .evidence-wrap { padding: 20px; }

    .evidence-meta {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .evidence-scene {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #eae9e4;
      border-radius: 8px;
    }

    .wall-line {
      position: absolute;
      inset: 64% 0 auto;
      height: 1px;
      background: #d2d0c8;
    }

    .desk {
      position: absolute;
      left: 10%;
      right: 8%;
      bottom: 12%;
      height: 20%;
      background: #aaa49a;
      border-radius: 4px 4px 2px 2px;
    }

    .drawer {
      position: absolute;
      right: 13%;
      bottom: 4%;
      width: 22%;
      height: 34%;
      background: #8f8980;
      border-radius: 3px;
    }

    .drawer::before,
    .drawer::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      height: 1px;
      background: #aaa49a;
    }

    .drawer::before { top: 34%; }
    .drawer::after { top: 67%; }

    .headphones {
      position: absolute;
      left: 25%;
      bottom: 28%;
      width: 66px;
      height: 46px;
      border: 7px solid #3f403e;
      border-bottom: 0;
      border-radius: 38px 38px 0 0;
      transform: rotate(-7deg);
    }

    .headphones::before,
    .headphones::after {
      content: "";
      position: absolute;
      bottom: -15px;
      width: 14px;
      height: 23px;
      background: #3f403e;
      border-radius: 7px;
    }

    .headphones::before { left: -9px; }
    .headphones::after { right: -9px; }

    .evidence-caption {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .site-header {
        height: 64px;
        padding: 0 20px;
      }

      .shell {
        width: min(100% - 32px, 720px);
        margin-top: clamp(54px, 10vh, 88px);
      }

      .search-section h1 { margin-bottom: 18px; }

      .result {
        margin-top: 48px;
        padding-top: 28px;
      }

      .result-actions {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .evidence-wrap { padding: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header" aria-label="产品">
    <a class="wordmark" href="#" aria-label="Where is it 首页">where is it</a>
  </header>

  <main class="shell" id="main">
    <section class="search-section" aria-labelledby="page-title">
      <h1 id="page-title">想找什么？</h1>

      <form class="composer" id="search-form">
        <label class="live-status" for="query">描述要找的物品</label>
        <textarea id="query" name="query" rows="2" autocomplete="off" placeholder="例如：我的耳机在哪里？">我的耳机在哪里？</textarea>

        <div class="composer-actions">
          <button class="icon-button" type="button" aria-label="使用语音输入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8.25" y="3.25" width="7.5" height="12" rx="3.75"></rect>
              <path d="M5.75 11.5a6.25 6.25 0 0 0 12.5 0M12 17.75v3M8.75 20.75h6.5"></path>
            </svg>
          </button>

          <button class="submit-button" id="submit-button" type="submit" aria-label="开始查找">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path>
            </svg>
          </button>
        </div>
      </form>
      <p class="live-status" id="search-status" aria-live="polite"></p>
    </section>

    <section class="result" id="result" aria-labelledby="result-title">
      <p class="result-kicker"><span class="result-dot" aria-hidden="true"></span>当前画面未检测到</p>
      <h2 class="answer" id="result-title">最后在书桌左侧看到</h2>
      <p class="answer-detail">书房摄像头 · 今天 22:14 · 2 分钟前</p>

      <div class="result-actions">
        <button class="text-button" id="evidence-button" type="button">查看证据</button>
      </div>
    </section>
  </main>

  <dialog id="evidence-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="dialog-title">最后一次看到</h2>
      <button class="close-button" id="close-dialog" type="button" aria-label="关闭证据">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
      </button>
    </div>

    <div class="evidence-wrap">
      <p class="evidence-meta">书房摄像头 · 今天 22:14</p>
      <div class="evidence-scene" role="img" aria-label="耳机位于书桌左侧的监控画面示意">
        <span class="wall-line"></span>
        <span class="desk"></span>
        <span class="drawer"></span>
        <span class="headphones"></span>
      </div>
      <p class="evidence-caption">耳机在书桌左侧边缘出现，之后没有再次被摄像头看到。推测目前可能在书桌抽屉附近。</p>
    </div>
  </dialog>

  <script>
    const form = document.querySelector("#search-form");
    const query = document.querySelector("#query");
    const submitButton = document.querySelector("#submit-button");
    const status = document.querySelector("#search-status");
    const result = document.querySelector("#result");
    const evidenceButton = document.querySelector("#evidence-button");
    const evidenceDialog = document.querySelector("#evidence-dialog");
    const closeDialog = document.querySelector("#close-dialog");

    const resizeQuery = () => {
      query.style.height = "auto";
      query.style.height = Math.min(query.scrollHeight, 144) + "px";
    };

    query.addEventListener("input", resizeQuery);
    resizeQuery();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!query.value.trim()) {
        status.textContent = "请先描述要找的物品。";
        query.focus();
        return;
      }

      submitButton.disabled = true;
      status.textContent = "正在查找。";

      window.setTimeout(() => {
        submitButton.disabled = false;
        status.textContent = "查找完成。";
        result.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 520);
    });

    evidenceButton.addEventListener("click", () => evidenceDialog.showModal());
    closeDialog.addEventListener("click", () => evidenceDialog.close());
    evidenceDialog.addEventListener("click", (event) => {
      if (event.target === evidenceDialog) evidenceDialog.close();
    });
  </script>
</body>
</html>
