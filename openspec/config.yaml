schema: spec-driven

context: |
  产品：面向独居个人、单卧室场景的室内物品查找助手。
  首版形态：响应式网页，接入单个摄像头，支持键盘/麦克风提问和文字/语音回答。
  核心承诺：明确区分当前检测位置、最后出现位置和推测位置。
  交付目标：可演示的产品概念验证，以及可继续完善的完整工程。
  工件语言：简体中文；规范关键词 MUST/SHOULD/MAY 保持英文。

rules:
  proposal:
    - 明确写出首版范围和非目标
  specs:
    - 每项 Requirement 至少包含一个 Given/When/Then 场景
    - 对确定事实、未检测状态和推测结论使用可验收的不同表述
    - 所有对外可引用的物品和位置都必须具备稳定唯一标识
  design:
    - 说明开源视觉模型、LLM、事件存储和网页语音能力的边界
    - 对五秒响应目标给出降级策略
  tasks:
    - 使用可勾选任务
    - 每组任务包含相应验证项
