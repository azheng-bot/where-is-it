name: where-is-it-web

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL to the GPU API endpoint}
        VITE_VISION_BASE_URL: ${PUBLIC_VISION_URL:?set PUBLIC_VISION_URL to the GPU vision endpoint}
    ports:
      - "${WEB_PORT:-5173}:80"